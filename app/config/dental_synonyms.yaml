# =====================================================================
# Dental query expansion dictionary
# =====================================================================
# Used by app/evidence/query_expander.py.
#
# Design rules (PART 16):
#  - Expansion widens recall, it must not change the user's question.
#  - A concept is expanded ONLY if one of its trigger terms appears in
#    the query. There is no blanket expansion.
#  - Brand names live in `brands:` and are added only when the brand is
#    explicitly mentioned. Searching "lithium disilicate" must NOT be
#    narrowed to IPS e.max; but searching "IPS e.max" DOES add
#    "lithium disilicate" (brand -> generic is safe, generic -> brand
#    is not).
#  - `max_terms_per_concept` in evidence_rules.yaml caps how many
#    synonyms are injected so the final PubMed query stays tractable.
#
# Structure:
#   concepts:
#     <key>:
#       specialty: <specialty tag or 'all'>
#       terms: [...]          # trigger + expansion terms (bidirectional)
#       mesh: [...]           # optional MeSH headings
#   brands:
#     <key>:
#       terms: [...]          # brand spellings that trigger it
#       generic: [...]        # generic concepts added when triggered
#       manufacturer: <name>
# =====================================================================


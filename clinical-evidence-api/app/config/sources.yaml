# =====================================================================
# Clinical Evidence Safe Search — HARD SOURCE ALLOWLIST
# =====================================================================
# This file is NOT documentation. It is loaded at startup by
# app/security/allowlist.py and enforced on every outbound request and
# every returned URL. A domain that is not in this file cannot be
# fetched by the backend and cannot appear in an API response.
#
# Schema for every entry:
#   domain:              registrable host (no scheme, no path)
#   include_subdomains:  bool — allow *.domain
#   category:            see PART 70 categories below
#   specialties:         list of dental specialties (optional)
#   allowed_for:         permitted uses
#   forbidden_for:       explicitly prohibited uses
#   trust_tier:          evidence | guideline | professional | regulatory
#                        | manufacturer | metadata
#
# Categories:
#   scientific_database, journal, professional_organization,
#   guideline_body, regulator, standards_body, manufacturer,
#   bibliographic_metadata, clinical_trial_registry,
#   public_health_authority
#
# CHANGE LOG vs. the originally requested list (see README "Source list
# verification"):
#   + eutils.ncbi.nlm.nih.gov     covered by ncbi.nlm.nih.gov subdomains
#   + api.fda.gov                 ADDED — the real openFDA API host
#   + ebi.ac.uk                   ADDED — the real Europe PMC REST host
#   + api.crossref.org            covered by crossref.org subdomains
#   + zimvie.com                  ADDED — Zimmer Biomet Dental became
#                                 ZimVie (2022); zimmerbiomet.com kept
#                                 for legacy/medical documents
#   ~ health-canada.canada.ca     CORRECTED to canada.ca (the official
#                                 registrable domain; Health Canada lives
#                                 under canada.ca/en/health-canada)
#   ~ 3m.com / solventum.com      both kept: 3M Health Care's oral care
#                                 business became Solventum in 2024,
#                                 legacy IFUs still sit on 3m.com
#   + gceurope.com                ADDED alongside gc.dental (GC uses both)
# =====================================================================

sources:

  # ==================================================================
  # CORE EVIDENCE / BIBLIOGRAPHY
  # ==================================================================

  pubmed:
    domain: pubmed.ncbi.nlm.nih.gov
    include_subdomains: false
    category: scientific_database
    specialties: [all]
    allowed_for: [clinical_evidence, literature_search, metadata]
    forbidden_for: []
    trust_tier: evidence

  pmc:
    domain: pmc.ncbi.nlm.nih.gov
    include_subdomains: false
    category: scientific_database
    specialties: [all]
    allowed_for: [clinical_evidence, literature_search, full_text, metadata]
    forbidden_for: []
    trust_tier: evidence

  ncbi:
    domain: ncbi.nlm.nih.gov
    include_subdomains: true
    category: scientific_database
    specialties: [all]
    allowed_for: [clinical_evidence, literature_search, api_access, metadata]
    forbidden_for: []
    trust_tier: evidence
    notes: >
      Covers eutils.ncbi.nlm.nih.gov (E-utilities API) via subdomains.

  europe_pmc:
    domain: europepmc.org
    include_subdomains: true
    category: scientific_database
    specialties: [all]
    allowed_for: [clinical_evidence, literature_search, full_text, metadata]
    forbidden_for: []
    trust_tier: evidence

  ebi:
    domain: ebi.ac.uk
    include_subdomains: true
    category: scientific_database
    specialties: [all]
    allowed_for: [literature_search, api_access, metadata]
    forbidden_for: []
    trust_tier: evidence
    notes: >
      ADDED. The Europe PMC REST API is served from
      www.ebi.ac.uk/europepmc/webservices/rest. Without this entry the
      Europe PMC engine would be blocked by its own SSRF/allowlist guard.

  cochrane:
    domain: cochranelibrary.com
    include_subdomains: true
    category: scientific_database
    specialties: [all]
    allowed_for: [clinical_evidence, systematic_reviews, literature_search]
    forbidden_for: []
    trust_tier: evidence

  clinicaltrials:
    domain: clinicaltrials.gov
    include_subdomains: true
    category: clinical_trial_registry
    specialties: [all]
    allowed_for: [trial_registration, study_protocol, recruitment_status]
    forbidden_for: [proving_clinical_efficacy]
    trust_tier: evidence
    notes: >
      A registered trial is not a result. Registration entries must never
      be presented as outcome evidence.

  crossref:
    domain: crossref.org
    include_subdomains: true
    category: bibliographic_metadata
    specialties: [all]
    allowed_for: [metadata_validation, doi_resolution, retraction_metadata]
    forbidden_for: [clinical_recommendation, evidence_grading]
    trust_tier: metadata

  doi:
    domain: doi.org
    include_subdomains: true
    category: bibliographic_metadata
    specialties: [all]
    allowed_for: [doi_resolution]
    forbidden_for: [clinical_recommendation]

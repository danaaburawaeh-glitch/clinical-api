# =====================================================================
# Local development stack
#   docker compose up --build
#   -> http://localhost:8000/health
#   -> http://localhost:8000/docs   (disabled when ENVIRONMENT=production)
# =====================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: clinical-evidence-gateway:latest
    container_name: clinical-evidence-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Compose-local overrides; .env still supplies the secrets.
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CACHE_DATABASE_URL: sqlite:////app/data/cache.db
    volumes:
      # Persist the cache across container restarts.
      - evidence-cache:/app/data
      # Hot-reload configuration without rebuilding the image. Editing
      # sources.yaml here changes the allowlist on the next restart.
      - ./app/config:/app/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: false
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  evidence-cache:

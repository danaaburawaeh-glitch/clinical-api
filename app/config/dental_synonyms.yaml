# =====================================================================
# Terms that must NEVER be auto-injected into a query, because they
# silently convert a clinical question into a laboratory question.
# The query expander refuses to add these unless the user typed them.
# =====================================================================
never_auto_expand:
  - bond strength
  - shear bond strength
  - microtensile
  - thermocycling
  - finite element
  - artificial saliva
  - in vitro

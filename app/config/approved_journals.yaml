# =====================================================================
# Approved journal registry
# =====================================================================
# Why this file exists (PART 24):
# Allowlisting sciencedirect.com / wiley.com / springer.com / sagepub.com
# admits thousands of journals, most of which have nothing to do with
# dentistry and some of which are predatory. Domain allowlisting alone is
# therefore not sufficient for the "journal" source category.
#
# This registry is used for TWO purposes and two purposes only:
#   1. Journal-relevance scoring in app/evidence/ranker.py
#   2. Marking a record's `journal_recognised` flag in API output
#
# It is deliberately NOT used to hard-filter PubMed/Europe PMC records.
# Reason: a legitimate, highly relevant study can appear in a journal not
# yet in this list, and silently deleting it would be a worse failure
# than surfacing it with a lower rank. Records from unrecognised journals
# are ranked lower and flagged, never fabricated away.
#
# Fields per entry:
#   name          canonical journal title
#   abbrev        common NLM abbreviation(s), used for matching
#   issn          print/electronic ISSN where known (null if unverified)
#   publisher     publisher name
#   specialty     primary dental specialty
#   peer_reviewed bool
#   status        active | renamed | ceased
#   tier          core | major | supporting
#
# ISSNs are only filled in where they could be stated with confidence.
# `null` means "not verified" — it is never guessed. See PART 59/68.
# =====================================================================


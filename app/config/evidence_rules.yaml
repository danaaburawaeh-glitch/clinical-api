# =====================================================================
# Evidence classification, ranking and firewall rules
# =====================================================================
# Consumed by:
#   app/evidence/classifier.py
#   app/evidence/ranker.py
#   app/evidence/retraction_check.py
#   app/evidence/query_expander.py
#
# IMPORTANT HONESTY NOTE (PART 11):
# What this file drives is "automated evidence prioritization".
# It is NOT GRADE, NOT ROB2, NOT ROBINS-I, NOT AMSTAR-2. Those require
# full-text appraisal and human judgement. Nothing in this system should
# ever be described as a formal risk-of-bias assessment.
# =====================================================================

meta:
  scheme_name: "Automated evidence prioritization (non-GRADE)"
  version: "1.0.0"
  disclaimer: >
    Classification is derived from publication metadata (publication
    types, title, abstract) only. It is a triage aid for a clinician,
    not a formal risk-of-bias or certainty-of-evidence assessment.

# =====================================================================
# INTERNAL EVIDENCE CLASSES (PART 11)
# =====================================================================
classes:
  A1:
    label: High-quality clinical practice guideline
    api_level: GUIDELINE
    base_score: 100
    design: guideline
  A2:
    label: Systematic review / meta-analysis
    api_level: HIGH
    base_score: 95
    design: systematic_review
  A3:
    label: Randomized controlled clinical trial
    api_level: HIGH
    base_score: 85
    design: randomized_controlled_trial
  B1:
    label: Prospective cohort study
    api_level: MODERATE
    base_score: 70
    design: cohort
  B2:
    label: Retrospective cohort study
    api_level: MODERATE
    base_score: 62
    design: cohort
  B3:
    label: Case-control study
    api_level: MODERATE
    base_score: 55
    design: case_control
  C1:
    label: Cross-sectional / diagnostic accuracy study
    api_level: LIMITED
    base_score: 48
    design: cross_sectional
  C2:
    label: Case series
    api_level: LIMITED
    base_score: 32
    design: case_series
  C3:
    label: Case report
    api_level: LIMITED
    base_score: 22
    design: case_report
  D1:
    label: In-vitro / laboratory study
    api_level: EARLY_PRECLINICAL
    base_score: 18
    design: laboratory
  D2:
    label: Animal / preclinical study
    api_level: EARLY_PRECLINICAL
    base_score: 15
    design: laboratory
  M:
    label: Manufacturer information
    api_level: MANUFACTURER_INFORMATION
    base_score: 10
    design: manufacturer_document
  R:
    label: Regulatory record
    api_level: REGULATORY
    base_score: 10
    design: regulatory_record
  NARRATIVE:
    label: Narrative review / expert opinion
    api_level: LIMITED
    base_score: 35
    design: narrative_review
  U:
    label: Unclassified
    api_level: UNCLASSIFIED
    base_score: 20
    design: unclassified

# =====================================================================
# PUBLICATION-TYPE MAPPING (NCBI / Europe PMC publication types)
# Evaluated in order; first match wins.
# =====================================================================
publication_type_map:
  - types: ["Practice Guideline", "Guideline", "Consensus Development Conference",
            "Consensus Development Conference, NIH"]
    cls: A1
  - types: ["Meta-Analysis", "Systematic Review"]
    cls: A2
  - types: ["Randomized Controlled Trial", "Pragmatic Clinical Trial",
            "Controlled Clinical Trial", "Equivalence Trial"]
    cls: A3
  - types: ["Clinical Trial, Phase III", "Clinical Trial, Phase IV"]
    cls: A3
  - types: ["Clinical Trial", "Clinical Trial, Phase I", "Clinical Trial, Phase II",
            "Multicenter Study", "Comparative Study", "Clinical Study",
            "Observational Study"]
    cls: B1
  - types: ["Validation Study", "Evaluation Study"]
    cls: C1
  - types: ["Case Reports"]
    cls: C3
  - types: ["Review", "Journal Article, Review"]
    cls: NARRATIVE
  - types: ["Editorial", "Letter", "Comment", "News", "Historical Article",
            "Published Erratum", "Congress", "Address", "Biography"]
    cls: U

# =====================================================================
# TITLE / ABSTRACT PATTERN CLASSIFIERS
# Applied when publication types are absent or unhelpful.
# Patterns are case-insensitive regular expressions.
# =====================================================================
text_patterns:

  A1:
    - "clinical practice guideline"
    - "\\bs3[- ]level guideline\\b"
    - "\\bevidence[- ]based (clinical )?guideline"
    - "consensus (report|statement|conference)"
    - "position (statement|paper)"
    - "parameters of care"
    - "best practice(s)? (guideline|statement)"

  A2:
    - "systematic review"
    - "meta[- ]?analys(is|es)"
    - "umbrella review"
    - "network meta[- ]?analysis"
    - "scoping review"
    - "\\bPRISMA\\b"

  A3:
    - "randomi[sz]ed (controlled )?(clinical )?trial"
    - "\\bRCT\\b"
    - "randomi[sz]ed, (double|single)[- ]blind"
    - "split[- ]mouth randomi[sz]ed"
    - "double[- ]blind, placebo[- ]controlled"

  B1:
    - "prospective (cohort|clinical|observational|study)"
    - "prospective (multicent(er|re))? ?(clinical )?(follow[- ]up|evaluation)"
    - "consecutive patients .{0,40}prospectively"

  B2:
    - "retrospective (cohort|clinical|chart|analysis|study|evaluation)"
    - "retrospectively (analy[sz]ed|reviewed|evaluated)"
    - "practice[- ]based retrospective"

  B3:
    - "case[- ]control study"
    - "matched case[- ]control"

  C1:
    - "cross[- ]sectional"
    - "diagnostic accuracy"
    - "sensitivity and specificity"
    - "questionnaire (study|survey)"
    - "\\bsurvey of\\b"
    - "\\bprevalence of\\b"
    - "\\bSTARD\\b"

  C2:
    - "case series"
    - "\\bconsecutive cases\\b"
    - "clinical report of \\d+ (patients|cases)"

  C3:
    - "case report"
    - "\\ba case of\\b"
    - "clinical case report"

  D2:
    - "\\bin vivo\\b.{0,30}(rat|mice|mouse|rabbit|dog|canine|porcine|sheep|beagle)"
    - "\\banimal (model|study|experiment)"
    - "(rat|rabbit|beagle|canine|porcine|ovine) (model|mandible|calvaria)"
    - "\\bpreclinical\\b"

  NARRATIVE:
    - "narrative review"
    - "\\ba review of the literature\\b"
    - "state of the art review"
    - "critical review"
    - "expert opinion"

# =====================================================================
# LABORATORY EVIDENCE FIREWALL (PART 12)
# Any record matching these markers is forced to class D1 and receives
# clinical_translation = "uncertain", regardless of what its publication
# types claim. An in-vitro study labelled "Comparative Study" must not
# be ranked as a clinical comparison.
# =====================================================================
laboratory_firewall:
  enabled: true
  forced_class: D1
  clinical_translation: uncertain
  markers:
    - "\\bin vitro\\b"
    - "\\bin[- ]vitro\\b"
    - "bond strength"
    - "shear bond strength"
    - "\\bSBS\\b"
    - "microtensile bond strength"
    - "\\b(micro)?tensile bond strength\\b"
    - "\\bµTBS\\b"
    - "\\bmicroshear\\b"
    - "push[- ]out bond strength"
    - "thermocycl(ing|ed|es)"
    - "thermo[- ]mechanical (aging|ageing|loading)"
    - "artificial (aging|ageing)"
    - "hydrothermal aging"
    - "finite element (analysis|method|model)"
    - "\\bFEA\\b"
    - "artificial saliva"
    - "\\bwear (test|testing|simulation)\\b"
    - "chewing simulat(or|ion)"
    - "fracture (resistance|load|strength) of .{0,60}(specimen|disc|bar|block)"
    - "flexural strength"
    - "biaxial flexural"
    - "\\bVickers (micro)?hardness\\b"
    - "surface roughness .{0,30}(specimen|disc|bar)"
    - "colour stability .{0,30}(specimen|disc)"
    - "color stability .{0,30}(specimen|disc)"
    - "marginal (gap|discrepancy) .{0,40}(micro[- ]?CT|specimen|die)"
    - "micro[- ]?CT (analysis|evaluation) of .{0,40}(specimen|extracted)"
    - "extracted (human )?(teeth|molars|premolars|incisors)"
    - "bovine (dentin|dentine|enamel)"
    - "\\bspecimens were\\b"
    - "\\bdisc[- ]shaped specimens\\b"
    - "scanning electron microscop"
    - "\\bSEM analysis\\b"
    - "cell (viability|culture) assay"
    - "cytotoxicity"
    - "\\bMTT assay\\b"
    - "biofilm model"
    - "\\bagar diffusion\\b"

  # A record matching a laboratory marker is NOT forced to D1 if it also
  # matches one of these, because these indicate a real clinical arm.
  clinical_override_markers:
    - "randomi[sz]ed (controlled )?clinical trial"
    - "\\bpatients were (randomi[sz]ed|recruited|enrolled|followed)"
    - "clinical (trial|follow[- ]up) of \\d+ (patients|participants)"
    - "\\byear (clinical )?follow[- ]up in patients"
    - "systematic review of clinical"

  # Wording the system is allowed to use about laboratory findings.
  safe_phrasing:
    allowed:
      - "laboratory testing reported ..."
      - "under in-vitro conditions ..."
      - "preclinical data suggest ..."
    forbidden:
      - "clinically superior"
      - "proven better outcomes"
      - "demonstrates improved survival"

# =====================================================================
# RETRACTION / CORRECTION DETECTION (PART 14)
# Severity ordering matters: a retraction is not an erratum.
# =====================================================================
integrity_flags:

  retracted:
    severity: 4
    excludes_from_recommendation: true
    api_flag: retraction_warning
    publication_types: ["Retracted Publication", "Retraction of Publication"]
    patterns:
      - "^retracted"
      - "\\bretraction notice\\b"
      - "\\bthis article has been retracted\\b"
      - "\\bwithdrawn:? "
      - "\\barticle withdrawn\\b"
    message: >
      This publication is flagged as retracted. It must not be used to
      support a clinical recommendation.

  expression_of_concern:
    severity: 3
    excludes_from_recommendation: true
    api_flag: integrity_warning
    publication_types: ["Expression of Concern"]
    patterns:
      - "expression of concern"
    message: >
      An expression of concern has been issued about this publication.
      Treat its findings as unreliable pending resolution.

  correction:
    severity: 2
    excludes_from_recommendation: false
    api_flag: integrity_notice
    publication_types: ["Published Erratum", "Corrected and Republished Article"]
    patterns:
      - "\\bcorrigendum\\b"
      - "\\bcorrection to:"
      - "\\bcorrected and republished\\b"
    message: >
      A correction has been published for this article. Check the
      corrected version before citing specific figures.

  erratum:
    severity: 1
    excludes_from_recommendation: false
    api_flag: integrity_notice
    publication_types: ["Published Erratum"]
    patterns:
      - "^erratum"
      - "\\berratum (to|for|in)\\b"
    message: >
      An erratum exists for this article.

  update:
    severity: 1
    excludes_from_recommendation: false
    api_flag: integrity_notice
    publication_types: ["Updated Article", "Update of"]
    patterns:
      - "^update of"
      - "\\bupdated version available\\b"
    message: >
      An updated version of this article exists.

# =====================================================================
# RANKING (PART 76)
# final_score = weighted sum of normalised 0..1 components.
# Documented publicly in README so ranking is not opaque.
# =====================================================================
ranking:
  weights:
    design: 0.34            # base_score of the evidence class
    directness: 0.14        # PICO element coverage in title/abstract
    specialty_relevance: 0.08
    recency: 0.12
    journal_recognition: 0.08
    query_relevance: 0.16   # token overlap with the user query
    guideline_bonus: 0.05
    integrity_penalty: 0.03 # applied negatively

  recency:
    # Half-life in years used for exponential recency decay.
    default_half_life_years: 10
    # Fast-moving specialties get a much shorter half-life (PART 33).
    fast_moving_half_life_years: 3
    fast_moving_specialties:
      - dental_ai
      - digital_dentistry
    # Landmark protection (PART 33): a systematic review, meta-analysis
    # or guideline never drops below this recency floor no matter how
    # old it is, so foundational work is not filtered out by age alone.
    landmark_floor: 0.55
    landmark_classes: [A1, A2]

  penalties:
    retracted: -1000        # effectively removes from ranked output
    expression_of_concern: -400
    correction: -5
    non_english_no_abstract: -8
    no_abstract: -6

  # Records at or below this final score are still returned but are
  # marked low_confidence_ranking = true.
  low_confidence_threshold: 25

# =====================================================================
# CONFLICT DETECTION (PART 15)
# =====================================================================
conflict_detection:
  # Only records at these classes participate in conflict detection.
  eligible_classes: [A1, A2, A3, B1]
  min_records: 2

  positive_markers:
    - "significantly (higher|better|greater|improved)"
    - "significant (improvement|benefit|reduction in failure)"
    - "superior (survival|performance|outcome)"
    - "favou?rs? the (test|intervention|experimental) group"
    - "reduced (failure|complication|debonding) rate"
    - "improved (survival|success) rate"
    - "was (more )?effective than"
    - "\\bp *[<≤] *0\\.0"

  negative_markers:
    - "no (statistically )?significant difference"
    - "no significant (benefit|effect|improvement|difference)"
    - "did not (differ|improve|reduce|increase)"
    - "\\bsimilar (survival|success|outcomes?|performance)\\b"
    - "comparable (results|outcomes|survival)"
    - "insufficient evidence"
    - "no evidence (of|for) a difference"
    - "\\bp *[>≥] *0\\.05"

  uncertainty_markers:
    - "further (research|studies|trials) (are|is) (needed|required)"
    - "low certainty"
    - "very low certainty"
    - "high risk of bias"
    - "heterogeneity was (high|substantial|considerable)"
    - "limited number of studies"

  # If the automated signal is weak/ambiguous, we say so rather than
  # inventing an explanation (PART 15).
  fallback_status: possible_conflict_requires_clinical_review

# =====================================================================
# QUERY EXPANSION LIMITS (PART 16)
# =====================================================================
query_expansion:
  max_concepts: 4
  max_terms_per_concept: 6
  max_total_terms: 24
  # Concept must match on a whole-word boundary to trigger.
  require_word_boundary: true
  # Brand -> generic is allowed; generic -> brand is not.
  allow_generic_to_brand: false

# =====================================================================
# CACHE TTLs, seconds (PART 34) — overridable via environment
# =====================================================================
cache_ttl_seconds:
  evidence_search: 43200      # 12 h
  regulatory_search: 3600     #  1 h
  manufacturer_search: 86400  # 24 h
  crossref_metadata: 604800   #  7 d
  guideline_search: 86400     # 24 h
  source_verify: 86400        # 24 h

# =====================================================================
# EVIDENCE SUMMARY SAFETY (PART 39)
# =====================================================================
evidence_summary:
  # The backend only ever produces a *count-based structural* summary.
  # It never states effect sizes, p-values, CIs, sample sizes or
  # follow-up durations that it did not literally read.
  enabled: true
  max_length_chars: 900
  never_state:
    - effect_size
    - p_value
    - confidence_interval
    - sample_size
    - follow_up_duration
  # If the record set is too heterogeneous / too thin to describe
  # structurally, defer to the model.
  defer_to_model_when:
    total_results_below: 2
    no_class_above: A3
